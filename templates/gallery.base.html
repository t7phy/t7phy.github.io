<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | Tanishq Sharma</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("siteTheme");
        if (saved === "elegant" || saved === "rustic") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (error) {}
    })();
  </script>
  <link id="siteFavicon" rel="icon" type="image/png" href="assets/images/favicon-square.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500;600&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Sorts+Mill+Goudy:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav>
    <div class="nav-controls">
      <div class="theme-switch" role="group" aria-label="Theme switch">
        <button class="theme-option" type="button" data-theme-choice="elegant" aria-pressed="true">Elegant</button>
        <button class="theme-option" type="button" data-theme-choice="rustic" aria-pressed="false">Rustic</button>
      </div>
      <div class="hamburger" onclick="openMenu()" aria-label="Open menu">
        <span></span><span></span><span></span>
      </div>
    </div>
  </nav>

  <div class="drawer-overlay" id="overlay" onclick="closeMenu()"></div>
  <div class="drawer" id="drawer">
    <button class="drawer-close" onclick="closeMenu()" aria-label="Close">&times;</button>
    <a href="index.html">Home</a>
    <a href="cv.html">CV</a>
    <a href="research.html">Research</a>
    <!-- Template for future placeholder menu pages:
    <a href="your-page.html" class="coming-soon">Your Page<span class="cs-tag">Coming soon</span></a>
    -->
    <a href="software.html" class="coming-soon">Software<span class="cs-tag">Coming soon</span></a>
    <a href="gallery.html">Gallery</a>
  </div>

  <div class="mobile-menu" id="mobileMenu">
    <button class="mobile-close" onclick="closeMenu()" aria-label="Close">&times;</button>
    <a href="index.html">Home</a>
    <a href="cv.html">CV</a>
    <a href="research.html">Research</a>
    <!-- Template for future placeholder menu pages:
    <a href="your-page.html" class="coming-soon">Your Page<span class="mobile-cs">Coming soon</span></a>
    -->
    <a href="software.html" class="coming-soon">Software<span class="mobile-cs">Coming soon</span></a>
    <a href="gallery.html">Gallery</a>
  </div>

  <div class="page-shell">
    <main class="research-main gallery-main">
      <h1 class="research-title">Gallery</h1>
      <div class="page-title-rule" aria-hidden="true"></div>

      <section class="gallery-grid" id="galleryGrid" aria-label="Gallery posts">
        {{GALLERY_CARDS}}
      </section>
    </main>

    <footer>
      <p class="copyright">&copy; 2026 Tanishq Sharma</p>
    </footer>
  </div>

  <script id="galleryData" type="application/json">{{GALLERY_DATA}}</script>
  <script>
    const THEME_KEY = "siteTheme";
    const isMobile = () => window.innerWidth <= 680;

    function applyTheme(theme) {
      const resolved = theme === "rustic" ? "rustic" : "elegant";
      document.documentElement.setAttribute("data-theme", resolved);
      const themeButtons = document.querySelectorAll(".theme-option");
      const siteFavicon = document.getElementById("siteFavicon");
      themeButtons.forEach(btn => {
        const active = btn.dataset.themeChoice === resolved;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-pressed", String(active));
      });
      if (siteFavicon) {
        siteFavicon.href = resolved === "rustic"
          ? "assets/images/favicon-square-rustic.png"
          : "assets/images/favicon-square.png";
      }
    }

    function initThemeToggle() {
      let initial = "elegant";
      try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === "rustic" || saved === "elegant") initial = saved;
      } catch (error) {}

      applyTheme(initial);

      const themeButtons = document.querySelectorAll(".theme-option");
      if (!themeButtons.length) return;
      themeButtons.forEach(btn => btn.addEventListener("click", () => {
        const next = btn.dataset.themeChoice === "rustic" ? "rustic" : "elegant";
        applyTheme(next);
        try {
          localStorage.setItem(THEME_KEY, next);
        } catch (error) {}
      }));
    }

    function openMenu() {
      if (isMobile()) {
        document.getElementById("mobileMenu").classList.add("open");
      } else {
        document.getElementById("drawer").classList.add("open");
        document.getElementById("overlay").classList.add("open");
      }
      document.body.style.overflow = "hidden";
    }

    function closeMenu() {
      document.getElementById("drawer").classList.remove("open");
      document.getElementById("overlay").classList.remove("open");
      document.getElementById("mobileMenu").classList.remove("open");
      document.body.style.overflow = "";
    }

    const galleryPosts = JSON.parse(document.getElementById("galleryData").textContent);
    const postNumberFromIndex = index => galleryPosts.length - index;

    document.getElementById("galleryGrid").addEventListener("click", event => {
      const card = event.target.closest(".gallery-card");
      if (!card) return;
      const postIndex = Number(card.dataset.postIndex);
      window.location.href = "gallery-view.html?post=" + postNumberFromIndex(postIndex);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeMenu();
      }
    });

    initThemeToggle();
  </script>
</body>
</html>
