<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanishq Sharma</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("siteTheme");
        if (saved === "elegant" || saved === "rustic") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (error) {}
    })();
  </script>
  <link id="siteFavicon" rel="icon" type="image/png" href="assets/images/favicon-square.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500;600&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Sorts+Mill+Goudy:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
  <body>
  <nav>
    <div class="nav-controls">
      <div class="theme-switch" role="group" aria-label="Theme switch">
        <button class="theme-option" type="button" data-theme-choice="elegant" aria-pressed="true">Elegant</button>
        <button class="theme-option" type="button" data-theme-choice="rustic" aria-pressed="false">Rustic</button>
      </div>
      <div class="hamburger" onclick="openMenu()" aria-label="Open menu">
        <span></span><span></span><span></span>
      </div>
    </div>
  </nav>

  <div class="drawer-overlay" id="overlay" onclick="closeMenu()"></div>
  <div class="drawer" id="drawer">
    <button class="drawer-close" onclick="closeMenu()" aria-label="Close">&times;</button>
    <a href="index.html">Home</a>
    <a href="#" class="coming-soon">CV<span class="cs-tag">coming soon</span></a>
    <a href="research.html">Research</a>
    <a href="#" class="coming-soon">Gallery<span class="cs-tag">coming soon</span></a>
  </div>

  <div class="mobile-menu" id="mobileMenu">
    <button class="mobile-close" onclick="closeMenu()" aria-label="Close">&times;</button>
    <a href="index.html">Home</a>
    <a href="#" class="coming-soon">CV<span class="mobile-cs">coming soon</span></a>
    <a href="research.html">Research</a>
    <a href="#" class="coming-soon">Gallery<span class="mobile-cs">coming soon</span></a>
  </div>

  <main class="hero">
    <section class="hero-left">
      <div class="identity">
        <div class="logo-wrap">
          <img id="homeLogo" src="assets/images/logo-bright.png" alt="Tanishq Sharma" draggable="false" />
        </div>
        <h1 class="name">Tanishq Sharma</h1>
      </div>
    </section>

    <section class="hero-right">
      <p class="discipline">Particle Theory and Phenomenology</p>
      <div class="position-block">
        <span class="position">Postdoctoral Researcher</span>
        <div class="at-line">
          <span class="at-sym">@</span>
          <span class="institution">Michigan State University</span>
        </div>
      </div>
    </section>

    <footer>
      <p class="copyright">&copy; 2026 Tanishq Sharma</p>
    </footer>
  </main>

  <script>
    const THEME_KEY = "siteTheme";
    const isMobile = () => window.innerWidth <= 680;

    function applyTheme(theme) {
      const resolved = theme === "rustic" ? "rustic" : "elegant";
      document.documentElement.setAttribute("data-theme", resolved);
      const themeButtons = document.querySelectorAll(".theme-option");
      const homeLogo = document.getElementById("homeLogo");
      const siteFavicon = document.getElementById("siteFavicon");
      themeButtons.forEach(btn => {
        const active = btn.dataset.themeChoice === resolved;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-pressed", String(active));
      });
      if (homeLogo) {
        homeLogo.src = resolved === "rustic"
          ? "assets/images/logo.png"
          : "assets/images/logo-bright.png";
      }
      if (siteFavicon) {
        siteFavicon.href = resolved === "rustic"
          ? "assets/images/favicon-square-rustic.png"
          : "assets/images/favicon-square.png";
      }
    }

    function initThemeToggle() {
      let initial = "elegant";
      try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === "rustic" || saved === "elegant") initial = saved;
      } catch (error) {}

      applyTheme(initial);

      const themeButtons = document.querySelectorAll(".theme-option");
      if (!themeButtons.length) return;
      themeButtons.forEach(btn => btn.addEventListener("click", () => {
        const next = btn.dataset.themeChoice === "rustic" ? "rustic" : "elegant";
        applyTheme(next);
        try {
          localStorage.setItem(THEME_KEY, next);
        } catch (error) {}
      }));
    }

    function openMenu() {
      if (isMobile()) {
        document.getElementById('mobileMenu').classList.add('open');
      } else {
        document.getElementById('drawer').classList.add('open');
        document.getElementById('overlay').classList.add('open');
      }
      document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
      document.getElementById('mobileMenu').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeMenu();
    });

    initThemeToggle();
  </script>
</body>
</html>
