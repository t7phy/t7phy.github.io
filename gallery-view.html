  <script>
    const THEME_KEY = "siteTheme";
    const MAX_DOTS = 6;
    const isMobileView = () => window.innerWidth <= 680;
    const raf = cb => window.requestAnimationFrame(cb);

    function applyTheme(theme) {
      const resolved = theme === "rustic" ? "rustic" : "elegant";
      document.documentElement.setAttribute("data-theme", resolved);
      const siteFavicon = document.getElementById("siteFavicon");
      if (siteFavicon) {
        siteFavicon.href = resolved === "rustic"
          ? "assets/images/favicon-square-rustic.png"
          : "assets/images/favicon-square.png";
      }
    }
    try {
      const saved = localStorage.getItem(THEME_KEY);
      applyTheme(saved === "rustic" ? "rustic" : "elegant");
    } catch (error) {
      applyTheme("elegant");
    }

    const galleryPosts = JSON.parse(document.getElementById("galleryData").textContent);
    const galleryFeed = document.getElementById("galleryFeed");
    const feedStates = [];

    function getVisibleDotIndices(total, active, maxDots = MAX_DOTS) {
      if (total <= maxDots) return Array.from({ length: total }, (_, i) => i);
      const half = Math.floor(maxDots / 2);
      let start = active - half + 1;
      if (start < 0) start = 0;
      if (start > total - maxDots) start = total - maxDots;
      return Array.from({ length: maxDots }, (_, i) => start + i);
    }

    function renderDots(state, total, active) {
      state.dots.innerHTML = "";
      if (total <= 1) return;
      const visible = getVisibleDotIndices(total, active);
      const first = visible[0];
      const last = visible[visible.length - 1];
      visible.forEach((itemIndex, dotPos) => {
        const dot = document.createElement("span");
        dot.className = "gallery-dot";
        if (itemIndex === active) dot.classList.add("active");
        if (total > MAX_DOTS) {
          if (first > 0 && dotPos === 0) dot.classList.add("mini");
          if (last < total - 1 && dotPos === visible.length - 1) dot.classList.add("mini");
        }
        state.dots.appendChild(dot);
      });
    }

    function captionNeedsClamp(captionEl) {
      const hadCollapsed = captionEl.classList.contains("collapsed");
      captionEl.classList.remove("collapsed");
      const fullHeight = captionEl.getBoundingClientRect().height;
      const styles = window.getComputedStyle(captionEl);
      const lineHeight = Number.parseFloat(styles.lineHeight || "0");
      if (hadCollapsed) captionEl.classList.add("collapsed");
      if (!lineHeight || Number.isNaN(lineHeight)) return false;
      return fullHeight > (lineHeight * 3) + 2;
    }

    function syncCaptionState(state) {
      if (!isMobileView()) {
        state.caption.classList.remove("collapsed");
        state.moreBtn.hidden = true;
        state.expanded = false;
        return;
      }
      if (state.expanded) {
        state.caption.classList.remove("collapsed");
        state.moreBtn.hidden = false;
        state.moreBtn.textContent = "Show less";
        return;
      }
      state.caption.classList.add("collapsed");
      raf(() => {
        const needsClamp = captionNeedsClamp(state.caption);
        state.moreBtn.hidden = !needsClamp;
        state.moreBtn.textContent = "Show more";
      });
    }

    function createMediaNode(item) {
      if (item.type === "video") {
        const shell = document.createElement("div");
        shell.className = "gallery-video-shell";

        const video = document.createElement("video");
        video.className = "gallery-media gallery-media-video";
        video.playsInline = true;
        video.preload = "metadata";
        video.loop = true;
        video.muted = true;
        if (item.poster) video.poster = item.poster;
        video.src = item.src;
        const desktopMode = !isMobileView();
        if (item.autoplay || isMobileView()) {
          video.autoplay = true;
        }

        const playBtn = document.createElement("button");
        playBtn.type = "button";
        playBtn.className = "gallery-video-play";
        playBtn.setAttribute("aria-label", "Play or pause video");
        playBtn.textContent = "▶";

        const muteBtn = document.createElement("button");
        muteBtn.type = "button";
        muteBtn.className = "gallery-video-mute";
        muteBtn.setAttribute("aria-label", "Mute or unmute video");
        muteBtn.textContent = "🔇";

        const syncButtons = () => {
          playBtn.classList.toggle("hidden", !video.paused && !video.ended);
          muteBtn.textContent = video.muted ? "🔇" : "🔊";
        };
        const togglePlay = () => {
          if (video.paused) {
            const p = video.play();
            if (p && typeof p.catch === "function") p.catch(() => {});
          } else {
            video.pause();
          }
          syncButtons();
        };

        if (desktopMode) {
          playBtn.addEventListener("click", event => {
            event.stopPropagation();
            togglePlay();
          });
          video.addEventListener("click", event => {
            event.stopPropagation();
            togglePlay();
          });
        } else {
          playBtn.hidden = true;
          playBtn.classList.add("hidden");
        }

        muteBtn.addEventListener("click", event => {
          event.stopPropagation();
          video.muted = !video.muted;
          syncButtons();
        });

        video.addEventListener("play", syncButtons);
        video.addEventListener("pause", syncButtons);
        video.addEventListener("ended", syncButtons);
        syncButtons();

        shell.append(video, playBtn, muteBtn);
        return shell;
      }
      const img = document.createElement("img");
      img.className = "gallery-media";
      img.src = item.src;
      img.alt = item.alt || "";
      img.draggable = false;
      return img;
    }

    function createFrame(item, itemIndex) {
      const newFrame = document.createElement("div");
      newFrame.className = "gallery-media-frame";
      newFrame.dataset.itemIndex = String(itemIndex);
      if (item.type === "video") {
        newFrame.dataset.videoAutoplay = (item.autoplay || isMobileView()) ? "1" : "0";
      }
      const mediaNode = createMediaNode(item);
      newFrame.append(mediaNode);
      return newFrame;
    }

    function syncVideoPlaybackForState(state) {
      const frames = state.stage.querySelectorAll(".gallery-media-frame");
      frames.forEach(frame => {
        const video = frame.querySelector("video");
        if (!video) return;
        const canPlay = frame.classList.contains("current") && frame.dataset.videoAutoplay === "1";
        if (canPlay) {
          const p = video.play();
          if (p && typeof p.catch === "function") p.catch(() => {});
        } else {
          video.pause();
        }
      });
    }

    function pauseAllVideos(state) {
      const frames = state.stage.querySelectorAll(".gallery-media-frame");
      frames.forEach(frame => {
        const video = frame.querySelector("video");
        if (video) video.pause();
      });
    }

    function setTranslateX(frame, valuePx, animate = true) {
      frame.style.transition = animate ? "" : "none";
      frame.style.transform = `translateX(${valuePx}px)`;
    }

    function mountMediaWithTransition(state, item, itemIndex, direction = 0) {
      const oldFrame = state.stage.querySelector(".gallery-media-frame.current");
      const newFrame = createFrame(item, itemIndex);
      newFrame.classList.add("current");
      state.stage.appendChild(newFrame);

      if (!oldFrame || direction === 0) {
        if (oldFrame) oldFrame.remove();
        setTranslateX(newFrame, 0, false);
        syncVideoPlaybackForState(state);
        return;
      }

      const width = state.stage.clientWidth || 1;
      const startX = direction > 0 ? width : -width;
      setTranslateX(newFrame, startX, false);
      raf(() => {
        setTranslateX(newFrame, 0, true);
        setTranslateX(oldFrame, -startX, true);
      });
      window.setTimeout(() => {
        oldFrame.remove();
        syncVideoPlaybackForState(state);
      }, 340);
    }

    function ensureAdjacentFrame(state, direction) {
      const post = galleryPosts[state.postIndex];
      const targetIndex = state.itemIndex + direction;
      if (targetIndex < 0 || targetIndex >= post.items.length) return null;
      const existing = state.stage.querySelector(`.gallery-media-frame[data-item-index="${targetIndex}"]`);
      if (existing) return existing;
      const frame = createFrame(post.items[targetIndex], targetIndex);
      state.stage.appendChild(frame);
      const width = state.stage.clientWidth || 1;
      setTranslateX(frame, direction > 0 ? width : -width, false);
      return frame;
    }

    function updateFeedPost(postIndex, direction = 0) {
      const state = feedStates[postIndex];
      const post = galleryPosts[postIndex];
      const item = post.items[state.itemIndex];
      const currentFrame = state.stage.querySelector(".gallery-media-frame.current");
      const mountedIndex = currentFrame ? Number(currentFrame.dataset.itemIndex) : -1;
      const needsRemount = direction !== 0 || mountedIndex !== state.itemIndex;
      if (needsRemount) {
        mountMediaWithTransition(state, item, state.itemIndex, direction);
      } else {
        syncVideoPlaybackForState(state);
      }
      state.date.textContent = post.date || "";
      state.date.hidden = !post.date;
      state.caption.textContent = post.caption || "";
      state.prevBtn.disabled = state.itemIndex === 0;
      state.nextBtn.disabled = state.itemIndex === post.items.length - 1;
      state.prevBtn.classList.toggle("hidden", state.itemIndex === 0);
      state.nextBtn.classList.toggle("hidden", state.itemIndex === post.items.length - 1);
      state.counter.hidden = post.items.length <= 1;
      state.counter.textContent = `${state.itemIndex + 1}/${post.items.length}`;
      renderDots(state, post.items.length, state.itemIndex);
      state.expanded = false;
      syncCaptionState(state);
    }

    function stepFeedItem(postIndex, direction) {
      const state = feedStates[postIndex];
      const max = galleryPosts[postIndex].items.length - 1;
      const next = Math.min(Math.max(state.itemIndex + direction, 0), max);
      if (next === state.itemIndex) return;
      state.itemIndex = next;
      updateFeedPost(postIndex, direction);
    }

    function buildFeed() {
      galleryPosts.forEach((post, postIndex) => {
        const article = document.createElement("article");
        article.className = "gallery-feed-post";
        article.dataset.postIndex = String(postIndex);

        const mediaWrap = document.createElement("div");
        mediaWrap.className = "gallery-feed-media-wrap";

        const prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.className = "gallery-nav gallery-prev";
        prevBtn.setAttribute("aria-label", "Previous item");
        prevBtn.innerHTML = "&#8249;";

        const stage = document.createElement("div");
        stage.className = "gallery-stage";

        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.className = "gallery-nav gallery-next";
        nextBtn.setAttribute("aria-label", "Next item");
        nextBtn.innerHTML = "&#8250;";

        mediaWrap.append(prevBtn, stage, nextBtn);

        const dots = document.createElement("div");
        dots.className = "gallery-item-dots";
        const counter = document.createElement("div");
        counter.className = "gallery-item-counter";
        counter.hidden = true;

        const captionPanel = document.createElement("aside");
        captionPanel.className = "gallery-caption-panel";

        const caption = document.createElement("div");
        caption.className = "gallery-caption";

        const moreBtn = document.createElement("button");
        moreBtn.type = "button";
        moreBtn.className = "gallery-caption-more";
        moreBtn.textContent = "Show more";

        const date = document.createElement("div");
        date.className = "gallery-date";

        captionPanel.append(caption, moreBtn, date);
        article.append(mediaWrap, counter, dots, captionPanel);
        galleryFeed.appendChild(article);

        feedStates.push({ postIndex, itemIndex: 0, prevBtn, nextBtn, stage, counter, dots, caption, moreBtn, date, expanded: false });
        updateFeedPost(postIndex, 0);

        prevBtn.addEventListener("click", () => stepFeedItem(postIndex, -1));
        nextBtn.addEventListener("click", () => stepFeedItem(postIndex, 1));

        let startX = 0;
        let startY = 0;
        let trackingPointer = false;
        let draggingCarousel = false;
        let dragDx = 0;
        let dragDirection = 0;
        let dragNeighbor = null;
        let pointerId = null;
        let startTime = 0;
        let lastMoveTime = 0;
        let lastMoveX = 0;
        let velocityX = 0;
        stage.addEventListener("pointerdown", event => {
          if (!isMobileView()) return;
          if (event.target.closest(".gallery-video-play") || event.target.closest(".gallery-video-mute")) return;
          trackingPointer = true;
          draggingCarousel = false;
          pointerId = event.pointerId;
          stage.setPointerCapture(pointerId);
          startX = event.clientX;
          startY = event.clientY;
          startTime = performance.now();
          lastMoveTime = startTime;
          lastMoveX = startX;
          velocityX = 0;
          dragDx = 0;
          dragDirection = 0;
          dragNeighbor = null;
        });
        stage.addEventListener("pointermove", event => {
          if (!isMobileView() || !trackingPointer) return;
          const dx = event.clientX - startX;
          const dy = event.clientY - startY;
          if (!draggingCarousel) {
            if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
            if (Math.abs(dx) <= Math.abs(dy)) {
              trackingPointer = false;
              if (pointerId !== null && stage.hasPointerCapture(pointerId)) stage.releasePointerCapture(pointerId);
              pointerId = null;
              return;
            }
            draggingCarousel = true;
          }
          event.preventDefault();
          dragDx = dx;
          const now = performance.now();
          const dt = Math.max(1, now - lastMoveTime);
          velocityX = (event.clientX - lastMoveX) / dt;
          lastMoveTime = now;
          lastMoveX = event.clientX;
          const candidateDirection = dx < 0 ? 1 : -1;
          if (candidateDirection !== dragDirection) {
            dragDirection = candidateDirection;
            dragNeighbor = ensureAdjacentFrame(feedStates[postIndex], dragDirection);
          }
          const state = feedStates[postIndex];
          const current = state.stage.querySelector(".gallery-media-frame.current");
          if (!current) return;
          pauseAllVideos(state);
          const width = state.stage.clientWidth || 1;
          const clampedDx = Math.max(-width, Math.min(width, dx));
          setTranslateX(current, clampedDx, false);
          if (dragNeighbor) {
            const offset = dragDirection > 0 ? width : -width;
            setTranslateX(dragNeighbor, clampedDx + offset, false);
          }
        });
        stage.addEventListener("pointerup", event => {
          if (!isMobileView() || !trackingPointer) return;
          trackingPointer = false;
          if (pointerId !== null && stage.hasPointerCapture(pointerId)) stage.releasePointerCapture(pointerId);
          pointerId = null;
          const state = feedStates[postIndex];
          const current = state.stage.querySelector(".gallery-media-frame.current");
          if (!current) return;
          const width = state.stage.clientWidth || 1;
          const travelRatio = Math.abs(dragDx) / width;
          const elapsed = Math.max(1, performance.now() - startTime);
          const avgVelocityX = dragDx / elapsed;
          const flickVelocity = Math.abs(velocityX) > 0.85 || Math.abs(avgVelocityX) > 0.75;
          const distancePass = travelRatio >= 0.38;
          const shouldAdvance = draggingCarousel && dragNeighbor && (distancePass || flickVelocity);
          if (shouldAdvance) {
            const advanceDir = dragDirection;
            const finalOut = advanceDir > 0 ? -width : width;
            setTranslateX(current, finalOut, true);
            setTranslateX(dragNeighbor, 0, true);
            current.classList.remove("current");
            dragNeighbor.classList.add("current");
            const newIndex = state.itemIndex + advanceDir;
            window.setTimeout(() => {
              current.remove();
              state.itemIndex = newIndex;
              state.stage.querySelectorAll(".gallery-media-frame").forEach(frame => {
                if (!frame.classList.contains("current")) frame.remove();
              });
              updateFeedPost(postIndex, 0);
            }, 340);
          } else {
            setTranslateX(current, 0, true);
            if (dragNeighbor) {
              const backTo = dragDirection > 0 ? width : -width;
              setTranslateX(dragNeighbor, backTo, true);
              window.setTimeout(() => {
                dragNeighbor.remove();
                syncVideoPlaybackForState(state);
              }, 340);
            } else {
              window.setTimeout(() => {
                syncVideoPlaybackForState(state);
              }, 340);
            }
          }
          draggingCarousel = false;
          dragNeighbor = null;
          dragDirection = 0;
          dragDx = 0;
        });
        stage.addEventListener("pointercancel", () => {
          trackingPointer = false;
          draggingCarousel = false;
          const state = feedStates[postIndex];
          const current = state.stage.querySelector(".gallery-media-frame.current");
          if (current) setTranslateX(current, 0, true);
          if (dragNeighbor) {
            const width = state.stage.clientWidth || 1;
            const backTo = dragDirection > 0 ? width : -width;
            setTranslateX(dragNeighbor, backTo, true);
            window.setTimeout(() => {
              dragNeighbor.remove();
              syncVideoPlaybackForState(state);
            }, 340);
          } else {
            window.setTimeout(() => {
              syncVideoPlaybackForState(state);
            }, 340);
          }
          dragNeighbor = null;
          dragDirection = 0;
          dragDx = 0;
          if (pointerId !== null && stage.hasPointerCapture(pointerId)) stage.releasePointerCapture(pointerId);
          pointerId = null;
        });

        moreBtn.addEventListener("click", () => {
          const state = feedStates[postIndex];
          state.expanded = !state.expanded;
          syncCaptionState(state);
        });
      });
    }

    buildFeed();

    const params = new URLSearchParams(window.location.search);
    const initialPost = Number(params.get("post"));
    if (Number.isInteger(initialPost) && initialPost >= 0 && initialPost < galleryPosts.length) {
      const target = galleryFeed.querySelector('[data-post-index="' + initialPost + '"]');
      if (target) target.scrollIntoView({ block: "start", behavior: "auto" });
    }

    document.getElementById("galleryBack").addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "gallery.html";
      }
    });

    window.addEventListener("resize", () => {
      feedStates.forEach(state => {
        syncCaptionState(state);
      });
    });
  </script>
