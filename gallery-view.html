  <script>
    const THEME_KEY = "siteTheme";
    const MAX_DOTS = 6;
    const MOBILE_ANIM_MS = 430;
    const MOBILE_ANIM_MULTIPLIER = 1.5;
    const DESKTOP_ANIM_MULTIPLIER = 2;
    const ITEM_ANIM_EASE = "cubic-bezier(0.22, 0.61, 0.36, 1)";
    const POST_ANIM_EASE = ITEM_ANIM_EASE;
    const ITEM_SWIPE_DISTANCE_RATIO = 0.38;
    const MOBILE_ITEM_SWIPE_DISTANCE_FACTOR = 0.2;
    const isMobileView = () => window.innerWidth <= 680;
    const raf = cb => window.requestAnimationFrame(cb);
    const currentAnimMs = () => Math.round(
      MOBILE_ANIM_MS * (isMobileView() ? MOBILE_ANIM_MULTIPLIER : DESKTOP_ANIM_MULTIPLIER)
    );

    function applyTheme(theme) {
      const resolved = theme === "rustic" ? "rustic" : "elegant";
      document.documentElement.setAttribute("data-theme", resolved);
      const siteFavicon = document.getElementById("siteFavicon");
      if (siteFavicon) {
        siteFavicon.href = resolved === "rustic"
          ? "assets/images/favicon-square-rustic.png"
          : "assets/images/favicon-square.png";
      }
    }
    try {
      const saved = localStorage.getItem(THEME_KEY);
      applyTheme(saved === "rustic" ? "rustic" : "elegant");
    } catch (error) {
      applyTheme("elegant");
    }

    const galleryPosts = JSON.parse(document.getElementById("galleryData").textContent);
    if (!Array.isArray(galleryPosts) || galleryPosts.length === 0) {
      throw new Error("Gallery data is empty.");
    }

    const stage = document.getElementById("galleryStage");
    const itemPrev = document.getElementById("itemPrev");
    const itemNext = document.getElementById("itemNext");
    const itemCounter = document.getElementById("itemCounter");
    const dots = document.getElementById("itemDots");
    const postCounter = document.getElementById("postCounter");
    const galleryFeed = document.getElementById("galleryFeed");
    const captionPanel = document.querySelector(".gallery-caption-panel");
    const caption = document.getElementById("postCaption");
    const moreBtn = document.getElementById("captionMore");
    const date = document.getElementById("postDate");
    const galleryPost = document.getElementById("galleryPost");

    const params = new URLSearchParams(window.location.search);
    const initialPostParam = Number(params.get("post"));

    function indexToPostNumber(index) {
      return galleryPosts.length - index;
    }

    function postNumberToIndex(postNumber) {
      return galleryPosts.length - postNumber;
    }

    function resolveInitialPostIndex(rawParam) {
      if (!Number.isInteger(rawParam)) return 0;
      // Canonical mode: URL uses displayed numbering (post x/n).
      if (rawParam >= 1 && rawParam <= galleryPosts.length) {
        return postNumberToIndex(rawParam);
      }
      // Backward compatibility for older links that used zero-based indices.
      if (rawParam >= 0 && rawParam < galleryPosts.length) {
        return rawParam;
      }
      return 0;
    }

    const state = {
      postIndex: resolveInitialPostIndex(initialPostParam),
      itemIndex: 0,
      expanded: false,
      transition: null,
      postTransition: null,
      gestureSettle: null,
      captionScrollMode: false
    };

    function getVisibleDotIndices(total, active, maxDots = MAX_DOTS) {
      if (total <= maxDots) return Array.from({ length: total }, (_, i) => i);
      const half = Math.floor(maxDots / 2);
      let start = active - half + 1;
      if (start < 0) start = 0;
      if (start > total - maxDots) start = total - maxDots;
      return Array.from({ length: maxDots }, (_, i) => start + i);
    }

    function renderDots(total, active) {
      dots.innerHTML = "";
      if (total <= 1) return;
      const visible = getVisibleDotIndices(total, active);
      const first = visible[0];
      const last = visible[visible.length - 1];
      visible.forEach((itemIndex, dotPos) => {
        const dot = document.createElement("span");
        dot.className = "gallery-dot";
        if (itemIndex === active) dot.classList.add("active");
        if (total > MAX_DOTS) {
          if (first > 0 && dotPos === 0) dot.classList.add("mini");
          if (last < total - 1 && dotPos === visible.length - 1) dot.classList.add("mini");
        }
        dots.appendChild(dot);
      });
    }

    function updatePostCounter(total, active) {
      const displayIndex = indexToPostNumber(active);
      postCounter.textContent = `post ${displayIndex}/${total}`;
    }

    function captionNeedsClamp(captionEl) {
      const hadCollapsed = captionEl.classList.contains("collapsed");
      captionEl.classList.remove("collapsed");
      const fullHeight = captionEl.getBoundingClientRect().height;
      const styles = window.getComputedStyle(captionEl);
      const lineHeight = Number.parseFloat(styles.lineHeight || "0");
      if (hadCollapsed) captionEl.classList.add("collapsed");
      if (!lineHeight || Number.isNaN(lineHeight)) return false;
      return fullHeight > (lineHeight * 3) + 2;
    }

    function syncCaptionState() {
      if (!isMobileView()) {
        caption.classList.remove("collapsed");
        moreBtn.hidden = true;
        state.expanded = false;
        return;
      }
      if (state.expanded) {
        caption.classList.remove("collapsed");
        moreBtn.hidden = false;
        moreBtn.textContent = "Show less";
        return;
      }
      caption.classList.add("collapsed");
      raf(() => {
        const needsClamp = captionNeedsClamp(caption);
        moreBtn.hidden = !needsClamp;
        moreBtn.textContent = "Show more";
      });
    }

    function captionHasOverflow() {
      return caption.scrollHeight > caption.clientHeight + 1;
    }

    function refreshCaptionScrollMode(reset = false) {
      if (isMobileView()) {
        state.captionScrollMode = false;
        return;
      }
      if (reset) {
        state.captionScrollMode = false;
        caption.scrollTop = 0;
      }
      if (!captionHasOverflow()) {
        state.captionScrollMode = false;
      }
    }

    function syncDesktopCaptionPaneHeight() {
      if (isMobileView()) {
        captionPanel.style.removeProperty("--gallery-caption-pane-height");
        return;
      }
      const stageHeight = Math.max(0, Math.round(stage.getBoundingClientRect().height));
      if (!stageHeight) return;
      const paneHeight = Math.round(stageHeight * 0.7);
      captionPanel.style.setProperty("--gallery-caption-pane-height", `${paneHeight}px`);
    }

    function scrollCaptionByKey(key) {
      const lineStep = 64;
      const pageStep = Math.max(120, Math.floor(caption.clientHeight * 0.8));
      if (key === "ArrowDown") {
        caption.scrollBy({ top: lineStep, left: 0, behavior: "auto" });
        return true;
      }
      if (key === "ArrowUp") {
        caption.scrollBy({ top: -lineStep, left: 0, behavior: "auto" });
        return true;
      }
      if (key === "PageDown") {
        caption.scrollBy({ top: pageStep, left: 0, behavior: "auto" });
        return true;
      }
      if (key === "PageUp") {
        caption.scrollBy({ top: -pageStep, left: 0, behavior: "auto" });
        return true;
      }
      return false;
    }

    function createMediaNode(item) {
      if (item.type === "video") {
        const shell = document.createElement("div");
        shell.className = "gallery-video-shell";

        const video = document.createElement("video");
        video.className = "gallery-media gallery-media-video";
        video.playsInline = true;
        video.preload = "metadata";
        video.loop = true;
        video.muted = true;
        if (item.poster) video.poster = item.poster;
        video.src = item.src;
        if (item.autoplay || isMobileView()) {
          video.autoplay = true;
        }

        const playBtn = document.createElement("button");
        playBtn.type = "button";
        playBtn.className = "gallery-video-play";
        playBtn.setAttribute("aria-label", "Play or pause video");
        playBtn.innerHTML = "&#9654;";

        const muteBtn = document.createElement("button");
        muteBtn.type = "button";
        muteBtn.className = "gallery-video-mute";
        muteBtn.setAttribute("aria-label", "Mute or unmute video");
        muteBtn.innerHTML = "&#128263;";

        const syncButtons = () => {
          playBtn.classList.toggle("hidden", !video.paused && !video.ended);
          muteBtn.innerHTML = video.muted ? "&#128263;" : "&#128266;";
        };
        const togglePlay = () => {
          if (video.paused) {
            const p = video.play();
            if (p && typeof p.catch === "function") p.catch(() => {});
          } else {
            video.pause();
          }
          syncButtons();
        };

        if (!isMobileView()) {
          playBtn.addEventListener("click", event => {
            event.stopPropagation();
            togglePlay();
          });
          video.addEventListener("click", event => {
            event.stopPropagation();
            togglePlay();
          });
        } else {
          playBtn.hidden = true;
          playBtn.classList.add("hidden");
        }

        muteBtn.addEventListener("click", event => {
          event.stopPropagation();
          video.muted = !video.muted;
          syncButtons();
        });

        video.addEventListener("play", syncButtons);
        video.addEventListener("pause", syncButtons);
        video.addEventListener("ended", syncButtons);
        syncButtons();

        shell.append(video, playBtn, muteBtn);
        return shell;
      }

      const picture = document.createElement("picture");
      picture.className = "gallery-picture";
      if (item.sourceType) {
        const source = document.createElement("source");
        source.srcset = item.src;
        source.type = item.sourceType;
        picture.appendChild(source);
      }
      const img = document.createElement("img");
      img.className = "gallery-media";
      img.src = item.fallbackSrc || item.src;
      img.alt = item.alt || "";
      img.draggable = false;
      picture.appendChild(img);
      return picture;
    }

    function createFrame(item, itemIndex) {
      const frame = document.createElement("div");
      frame.className = "gallery-media-frame";
      frame.dataset.itemIndex = String(itemIndex);
      if (item.type === "video") {
        frame.dataset.videoAutoplay = (item.autoplay || isMobileView()) ? "1" : "0";
      }
      frame.appendChild(createMediaNode(item));
      return frame;
    }

    function syncVideoPlayback() {
      const frames = stage.querySelectorAll(".gallery-media-frame");
      frames.forEach(frame => {
        const video = frame.querySelector("video");
        if (!video) return;
        const canPlay = frame.classList.contains("current") && frame.dataset.videoAutoplay === "1";
        if (canPlay) {
          const p = video.play();
          if (p && typeof p.catch === "function") p.catch(() => {});
        } else {
          video.pause();
        }
      });
    }

    function pauseAllVideos() {
      stage.querySelectorAll("video").forEach(video => video.pause());
    }

    function setTranslateX(frame, valuePx, animate = true, durationMs = currentAnimMs()) {
      frame.style.transition = animate ? `transform ${durationMs}ms ${ITEM_ANIM_EASE}` : "none";
      frame.style.transform = `translateX(${valuePx}px)`;
    }

    function keepOnlyFrame(frameToKeep) {
      stage.querySelectorAll(".gallery-media-frame").forEach(frame => {
        if (frame !== frameToKeep) frame.remove();
      });
    }

    function finalizeInFlightTransition(syncPlayback = false) {
      if (!state.transition) return;
      const { timeoutId, incomingFrame, outgoingFrame } = state.transition;
      if (timeoutId) window.clearTimeout(timeoutId);
      if (outgoingFrame && outgoingFrame.isConnected) outgoingFrame.remove();
      if (incomingFrame && incomingFrame.isConnected) {
        incomingFrame.classList.add("current");
        setTranslateX(incomingFrame, 0, false);
        keepOnlyFrame(incomingFrame);
      }
      state.transition = null;
      if (syncPlayback) syncVideoPlayback();
    }

    function finalizeGestureSettle(runFinalize = true) {
      if (!state.gestureSettle) return;
      const settle = state.gestureSettle;
      if (settle.timerId) window.clearTimeout(settle.timerId);
      state.gestureSettle = null;
      if (runFinalize && typeof settle.onFinalize === "function") {
        settle.onFinalize();
      }
    }

    function clearPostTransitionStyles() {
      galleryPost.style.willChange = "";
      galleryPost.style.transition = "";
      galleryPost.style.transform = "";
      galleryPost.style.opacity = "";
    }

    function finalizePostTransition(commitSwap = true) {
      if (!state.postTransition) return;
      const transition = state.postTransition;
      window.clearTimeout(transition.swapTimer);
      window.clearTimeout(transition.doneTimer);
      if (commitSwap && !transition.swapped) {
        transition.swapped = true;
        transition.onSwap();
      }
      state.postTransition = null;
      clearPostTransitionStyles();
    }

    function animatePostTransition(direction, onSwap) {
      finalizePostTransition();
      const postAnimMs = currentAnimMs();
      const postPhaseMs = Math.round(postAnimMs / 2);
      const distance = Math.round(Math.max(90, galleryPost.clientHeight * (isMobileView() ? 0.14 : 0.1)));
      const outY = direction > 0 ? -distance : distance;
      const inY = -outY;
      const transition = {
        swapTimer: 0,
        doneTimer: 0,
        swapped: false,
        onSwap
      };
      galleryPost.style.willChange = "transform, opacity";
      galleryPost.style.transition = `transform ${postPhaseMs}ms ${POST_ANIM_EASE}, opacity ${postPhaseMs}ms ease`;
      raf(() => {
        galleryPost.style.transform = `translateY(${outY}px)`;
        galleryPost.style.opacity = "0.01";
      });

      transition.swapTimer = window.setTimeout(() => {
        if (state.postTransition !== transition) return;
        transition.swapped = true;
        onSwap();
        galleryPost.style.transition = "none";
        galleryPost.style.transform = `translateY(${inY}px)`;
        galleryPost.style.opacity = "0.01";
        raf(() => {
          raf(() => {
            galleryPost.style.transition = `transform ${postPhaseMs}ms ${POST_ANIM_EASE}, opacity ${postPhaseMs}ms ease`;
            galleryPost.style.transform = "translateY(0)";
            galleryPost.style.opacity = "1";
          });
        });
      }, postPhaseMs);

      transition.doneTimer = window.setTimeout(() => {
        if (state.postTransition !== transition) return;
        state.postTransition = null;
        clearPostTransitionStyles();
      }, postAnimMs + 30);

      state.postTransition = transition;
    }

    function mountMediaWithTransition(item, itemIndex, direction = 0) {
      finalizeInFlightTransition(false);
      const animMs = currentAnimMs();
      const oldFrame = stage.querySelector(".gallery-media-frame.current");
      const newFrame = createFrame(item, itemIndex);
      newFrame.classList.add("current");
      stage.appendChild(newFrame);

      if (!oldFrame || direction === 0) {
        if (oldFrame) oldFrame.remove();
        setTranslateX(newFrame, 0, false);
        keepOnlyFrame(newFrame);
        syncVideoPlayback();
        return;
      }

      oldFrame.classList.remove("current");
      const width = stage.clientWidth || 1;
      const startX = direction > 0 ? width : -width;
      setTranslateX(newFrame, startX, false, animMs);
      // Use double-rAF so the browser commits the start transform before we animate.
      raf(() => {
        raf(() => {
          setTranslateX(newFrame, 0, true, animMs);
          setTranslateX(oldFrame, -startX, true, animMs);
        });
      });
      const timeoutId = window.setTimeout(() => {
        oldFrame.remove();
        keepOnlyFrame(newFrame);
        state.transition = null;
        syncVideoPlayback();
      }, animMs);
      state.transition = { timeoutId, incomingFrame: newFrame, outgoingFrame: oldFrame };
    }

    function ensureAdjacentFrame(direction) {
      const post = galleryPosts[state.postIndex];
      const targetIndex = state.itemIndex + direction;
      if (targetIndex < 0 || targetIndex >= post.items.length) return null;
      const existing = stage.querySelector(`.gallery-media-frame[data-item-index="${targetIndex}"]`);
      if (existing) return existing;
      const frame = createFrame(post.items[targetIndex], targetIndex);
      stage.appendChild(frame);
      const width = stage.clientWidth || 1;
      setTranslateX(frame, direction > 0 ? width : -width, false);
      return frame;
    }

    function updatePostParam() {
      const paramsNext = new URLSearchParams(window.location.search);
      paramsNext.set("post", String(indexToPostNumber(state.postIndex)));
      const next = `${window.location.pathname}?${paramsNext.toString()}`;
      window.history.replaceState(null, "", next);
    }

    function updateViewer(direction = 0) {
      const post = galleryPosts[state.postIndex];
      const item = post.items[state.itemIndex];
      const currentFrame = stage.querySelector(".gallery-media-frame.current");
      const mountedIndex = currentFrame ? Number(currentFrame.dataset.itemIndex) : -1;
      const needsRemount = direction !== 0 || mountedIndex !== state.itemIndex;
      if (needsRemount) {
        mountMediaWithTransition(item, state.itemIndex, direction);
      } else {
        syncVideoPlayback();
      }

      const totalPosts = galleryPosts.length;

      const shouldShowDate = Boolean(post.showDate) && Boolean(post.date);
      date.textContent = shouldShowDate ? post.date : "";
      date.hidden = !shouldShowDate;
      caption.textContent = post.caption || "";

      itemPrev.classList.toggle("hidden", state.itemIndex === 0);
      itemNext.classList.toggle("hidden", state.itemIndex === post.items.length - 1);

      itemCounter.hidden = post.items.length <= 1;
      itemCounter.textContent = `${state.itemIndex + 1}/${post.items.length}`;
      renderDots(post.items.length, state.itemIndex);
      updatePostCounter(totalPosts, state.postIndex);

      state.expanded = false;
      syncCaptionState();
      raf(() => {
        syncDesktopCaptionPaneHeight();
        refreshCaptionScrollMode(true);
      });
      updatePostParam();
    }

    function stepItem(direction) {
      if (state.postTransition) return;
      const post = galleryPosts[state.postIndex];
      const max = post.items.length - 1;
      const next = Math.min(Math.max(state.itemIndex + direction, 0), max);
      if (next === state.itemIndex) return;
      state.itemIndex = next;
      updateViewer(direction);
    }

    function stepPost(direction) {
      finalizePostTransition(true);
      const max = galleryPosts.length - 1;
      const next = Math.min(Math.max(state.postIndex + direction, 0), max);
      if (next === state.postIndex) return;
      finalizeInFlightTransition(false);
      pauseAllVideos();
      animatePostTransition(direction, () => {
        state.postIndex = next;
        state.itemIndex = 0;
        state.expanded = false;
        stage.innerHTML = "";
        updateViewer(0);
      });
    }

    function isEditableTarget(target) {
      if (!target) return false;
      if (target.isContentEditable) return true;
      const tag = target.tagName;
      return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
    }

    itemPrev.addEventListener("click", () => stepItem(-1));
    itemNext.addEventListener("click", () => stepItem(1));

    window.addEventListener("keydown", event => {
      if (isMobileView()) return;
      if (isEditableTarget(event.target)) return;
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (
        state.captionScrollMode &&
        captionHasOverflow() &&
        (event.key === "ArrowDown" || event.key === "ArrowUp" || event.key === "PageDown" || event.key === "PageUp")
      ) {
        event.preventDefault();
        scrollCaptionByKey(event.key);
        return;
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        stepItem(1);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        stepItem(-1);
      } else if (event.key === "ArrowDown" || event.key === "PageDown") {
        event.preventDefault();
        stepPost(1);
      } else if (event.key === "ArrowUp" || event.key === "PageUp") {
        event.preventDefault();
        stepPost(-1);
      }
    });

    captionPanel.addEventListener("pointerdown", () => {
      if (isMobileView()) return;
      if (captionHasOverflow()) {
        state.captionScrollMode = true;
      }
    });

    document.addEventListener("pointerdown", event => {
      if (isMobileView()) return;
      if (captionPanel.contains(event.target)) return;
      state.captionScrollMode = false;
    });

    window.addEventListener("resize", () => {
      syncDesktopCaptionPaneHeight();
      refreshCaptionScrollMode();
    });

    let startX = 0;
    let startY = 0;
    let trackingPointer = false;
    let gestureMode = null; // "item" | "post"
    let draggingCarousel = false;
    let dragDx = 0;
    let dragDy = 0;
    let dragDirection = 0;
    let dragNeighbor = null;
    let pointerId = null;
    let startTime = 0;
    let lastMoveTime = 0;
    let lastMoveX = 0;
    let lastMoveY = 0;
    let velocityX = 0;
    let velocityY = 0;
    let gestureOrigin = null; // "stage" | "caption"
    let pointerCaptureEl = null;
    let captionStartScrollTop = 0;

    function resetGestureState() {
      gestureMode = null;
      draggingCarousel = false;
      dragNeighbor = null;
      dragDirection = 0;
      dragDx = 0;
      dragDy = 0;
      velocityX = 0;
      velocityY = 0;
      gestureOrigin = null;
    }

    function releasePointerCaptureIfNeeded() {
      if (pointerId === null || !pointerCaptureEl) {
        pointerId = null;
        pointerCaptureEl = null;
        return;
      }
      if (pointerCaptureEl.hasPointerCapture(pointerId)) {
        pointerCaptureEl.releasePointerCapture(pointerId);
      }
      pointerId = null;
      pointerCaptureEl = null;
    }

    function shouldUseCaptionScrollOnMobile() {
      if (!isMobileView()) return false;
      if (!state.expanded) return false;
      if (moreBtn.hidden) return false;
      return captionHasOverflow();
    }

    function resolveMobileGestureOrigin(target) {
      if (target.closest(".gallery-stage")) return "stage";
      if (target.closest(".gallery-caption-panel")) return "caption";
      return "feed";
    }

    function onMobilePointerDown(event, origin) {
      if (!isMobileView()) return;
      if (event.target.closest(".gallery-caption-more")) return;
      if (event.target.closest(".gallery-video-play") || event.target.closest(".gallery-video-mute")) return;
      finalizeGestureSettle(true);
      finalizeInFlightTransition(true);
      finalizePostTransition(true);
      trackingPointer = true;
      pointerId = event.pointerId;
      pointerCaptureEl = event.currentTarget;
      if (pointerCaptureEl && typeof pointerCaptureEl.setPointerCapture === "function") {
        pointerCaptureEl.setPointerCapture(pointerId);
      }
      gestureOrigin = origin;
      gestureMode = null;
      draggingCarousel = false;
      startX = event.clientX;
      startY = event.clientY;
      startTime = performance.now();
      lastMoveTime = startTime;
      lastMoveX = startX;
      lastMoveY = startY;
      velocityX = 0;
      velocityY = 0;
      dragDx = 0;
      dragDy = 0;
      dragDirection = 0;
      dragNeighbor = null;
      if (origin === "caption" && shouldUseCaptionScrollOnMobile()) {
        gestureMode = "caption-scroll";
        captionStartScrollTop = caption.scrollTop;
      }
    }

    function onMobilePointerMove(event) {
      if (!isMobileView() || !trackingPointer) return;
      if (pointerId !== null && event.pointerId !== pointerId) return;
      const dx = event.clientX - startX;
      const dy = event.clientY - startY;
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      if (!gestureMode) {
        if (absX < 10 && absY < 10) return;
        if (gestureOrigin === "caption" || gestureOrigin === "feed") {
          if (absY > absX * 1.15) {
            gestureMode = "post";
          } else {
            return;
          }
        } else if (absX > absY * 1.25) {
          gestureMode = "item";
          draggingCarousel = true;
        } else if (absY > absX * 1.35) {
          gestureMode = "post";
        } else {
          return;
        }
      }

      const now = performance.now();
      const dt = Math.max(1, now - lastMoveTime);
      if (gestureMode === "caption-scroll") {
        event.preventDefault();
        const nextTop = captionStartScrollTop - dy;
        caption.scrollTop = nextTop;
        return;
      } else if (gestureMode === "item") {
        event.preventDefault();
        dragDx = dx;
        velocityX = (event.clientX - lastMoveX) / dt;
        lastMoveTime = now;
        lastMoveX = event.clientX;
        const candidateDirection = dx < 0 ? 1 : -1;
        if (candidateDirection !== dragDirection) {
          dragDirection = candidateDirection;
          dragNeighbor = ensureAdjacentFrame(dragDirection);
        }
        const current = stage.querySelector(".gallery-media-frame.current");
        if (!current) return;
        pauseAllVideos();
        const width = stage.clientWidth || 1;
        const clampedDx = Math.max(-width, Math.min(width, dx));
        setTranslateX(current, clampedDx, false);
        if (dragNeighbor) {
          const offset = dragDirection > 0 ? width : -width;
          setTranslateX(dragNeighbor, clampedDx + offset, false);
        }
      } else if (gestureMode === "post") {
        event.preventDefault();
        dragDy = dy;
        velocityY = (event.clientY - lastMoveY) / dt;
        lastMoveTime = now;
        lastMoveY = event.clientY;
      }
    }

    function onMobilePointerUp(event) {
      if (!isMobileView() || !trackingPointer) return;
      if (pointerId !== null && event.pointerId !== pointerId) return;
      trackingPointer = false;
      releasePointerCaptureIfNeeded();
      const elapsed = Math.max(1, performance.now() - startTime);
      const animMs = currentAnimMs();
      if (gestureMode === "caption-scroll") {
        resetGestureState();
        return;
      } else if (gestureMode === "item") {
        const current = stage.querySelector(".gallery-media-frame.current");
        if (!current) {
          resetGestureState();
          return;
        }
        const width = stage.clientWidth || 1;
        const travelRatio = Math.abs(dragDx) / width;
        const distanceThreshold = isMobileView()
          ? ITEM_SWIPE_DISTANCE_RATIO * MOBILE_ITEM_SWIPE_DISTANCE_FACTOR
          : ITEM_SWIPE_DISTANCE_RATIO;
        const avgVelocityX = dragDx / elapsed;
        const flickVelocity = Math.abs(velocityX) > 0.85 || Math.abs(avgVelocityX) > 0.75;
        const distancePass = travelRatio >= distanceThreshold;
        const shouldAdvance = draggingCarousel && dragNeighbor && (distancePass || flickVelocity);
        if (shouldAdvance) {
          const advanceDir = dragDirection;
          const finalOut = advanceDir > 0 ? -width : width;
          setTranslateX(current, finalOut, true);
          setTranslateX(dragNeighbor, 0, true);
          current.classList.remove("current");
          dragNeighbor.classList.add("current");
          const newIndex = state.itemIndex + advanceDir;
          const settleNow = () => {
            current.remove();
            state.itemIndex = newIndex;
            stage.querySelectorAll(".gallery-media-frame").forEach(frame => {
              if (!frame.classList.contains("current")) frame.remove();
            });
            updateViewer(0);
          };
          const timerId = window.setTimeout(() => {
            state.gestureSettle = null;
            settleNow();
          }, animMs);
          state.gestureSettle = { timerId, onFinalize: settleNow };
        } else {
          setTranslateX(current, 0, true);
          if (dragNeighbor) {
            const backTo = dragDirection > 0 ? width : -width;
            setTranslateX(dragNeighbor, backTo, true);
            const settleNow = () => {
              dragNeighbor.remove();
              syncVideoPlayback();
            };
            const timerId = window.setTimeout(() => {
              state.gestureSettle = null;
              settleNow();
            }, animMs);
            state.gestureSettle = { timerId, onFinalize: settleNow };
          } else {
            const settleNow = () => {
              syncVideoPlayback();
            };
            const timerId = window.setTimeout(() => {
              state.gestureSettle = null;
              settleNow();
            }, animMs);
            state.gestureSettle = { timerId, onFinalize: settleNow };
          }
        }
      } else if (gestureMode === "post") {
        const height = stage.clientHeight || 1;
        const travelRatioY = Math.abs(dragDy) / height;
        const avgVelocityY = dragDy / elapsed;
        const flickY = Math.abs(velocityY) > 0.95 || Math.abs(avgVelocityY) > 0.75;
        const distancePassY = travelRatioY >= 0.22;
        if (distancePassY || flickY) {
          const postDirection = dragDy < 0 ? 1 : -1;
          stepPost(postDirection);
        } else {
          syncVideoPlayback();
        }
      }

      resetGestureState();
    }

    function onMobilePointerCancel(event) {
      if (!trackingPointer) return;
      if (pointerId !== null && event.pointerId !== pointerId) return;
      trackingPointer = false;
      finalizeGestureSettle(false);
      const animMs = currentAnimMs();
      if (gestureMode === "caption-scroll") {
        // no-op: caption drag scrolling ends naturally
      } else if (gestureMode === "item") {
        const current = stage.querySelector(".gallery-media-frame.current");
        if (current) setTranslateX(current, 0, true);
        if (dragNeighbor) {
          const width = stage.clientWidth || 1;
          const backTo = dragDirection > 0 ? width : -width;
          setTranslateX(dragNeighbor, backTo, true);
          window.setTimeout(() => {
            dragNeighbor.remove();
            syncVideoPlayback();
          }, animMs);
        } else {
          window.setTimeout(() => {
            syncVideoPlayback();
          }, animMs);
        }
      } else {
        syncVideoPlayback();
      }
      resetGestureState();
      releasePointerCaptureIfNeeded();
    }

    galleryFeed.addEventListener("pointerdown", event => {
      onMobilePointerDown(event, resolveMobileGestureOrigin(event.target));
    });
    galleryFeed.addEventListener("pointermove", onMobilePointerMove);
    galleryFeed.addEventListener("pointerup", onMobilePointerUp);
    galleryFeed.addEventListener("pointercancel", onMobilePointerCancel);

    moreBtn.addEventListener("click", () => {
      state.expanded = !state.expanded;
      syncCaptionState();
      if (!state.expanded) {
        caption.scrollTop = 0;
      }
    });

    document.getElementById("galleryBack").addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "gallery.html";
      }
    });

    window.addEventListener("resize", () => {
      syncCaptionState();
      raf(() => refreshCaptionScrollMode(false));
      const post = galleryPosts[state.postIndex];
      const current = stage.querySelector(".gallery-media-frame.current");
      if (current && post && post.items[state.itemIndex] && current.dataset.videoAutoplay !== undefined) {
        current.dataset.videoAutoplay = (post.items[state.itemIndex].autoplay || isMobileView()) ? "1" : "0";
        syncVideoPlayback();
      }
    });

    updateViewer(0);
    syncDesktopCaptionPaneHeight();
  </script>
</body>
</html>
